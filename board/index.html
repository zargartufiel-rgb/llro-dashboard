<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LLRO Pace Board</title>
<meta name="theme-color" content="#13244B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div class="app" id="app">
  <nav class="rail" aria-label="Sections">
    <a class="brand" href="#/pace" aria-label="LLRO Pace Board — home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3c3 5 8 8 8 15a8 8 0 0 1-16 0c0-4 2-6 4-8 0 3 1 5 3 6-1-5 0-9 1-13z" fill="currentColor"/></svg>
      <span>LLRO</span>
    </a>
    <a href="#/pace" data-nav="pace"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18a8 8 0 1 1 16 0M12 18l4-6"/></svg><span>Pace</span></a>
    <a href="#/kpi/tot" data-nav="kpi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>KPIs</span></a>
    <a href="#/areas" data-nav="areas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></svg><span>Areas</span></a>
    <a href="#/dists" data-nav="dists"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V9l9-6 9 6v12H3zM9 21v-6h6v6"/></svg><span>Distributors</span></a>
    <a href="#/products" data-nav="products"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v3a4 4 0 0 1 3 4v9a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-9a4 4 0 0 1 3-4z"/></svg><span>Products</span></a>
    <a href="#/live" data-nav="live"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h4l3-7 4 14 3-7h6"/></svg><span>Live</span></a>
    <a href="#/sources" data-nav="sources"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6c0-2 16-2 16 0v12c0 2-16 2-16 0zM4 6c0 2 16 2 16 0M4 12c0 2 16 2 16 0"/></svg><span>Sources</span></a>
  </nav>
  <div class="main">
    <header class="top">
      <form class="ask" id="ask" role="search" autocomplete="off">
        <button class="mic" id="mic" type="button" aria-label="Speak a command" title="Speak a command (hold Alt + Space)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <label class="sr" for="q">Ask the board</label>
        <input id="q" name="q" type="text" placeholder="Ask: 19 kg sales in Kanpur vs last year" spellcheck="false">
        <kbd class="hint">Ctrl K</kbd>
      </form>
      <div class="when">
        <button class="ico" id="dPrev" type="button" aria-label="Previous day">‹</button>
        <label class="sr" for="day">Data date</label>
        <select id="day"></select>
        <button class="ico" id="dNext" type="button" aria-label="Next day">›</button>
      </div>
      <div class="seg" role="group" aria-label="Period">
        <button type="button" data-per="m" aria-pressed="true">Month</button>
        <button type="button" data-per="fy" aria-pressed="false">FY</button>
      </div>
      <button class="ico" id="theme" type="button" aria-label="Switch light or dark"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    </header>
    <div class="answer" id="answer" hidden aria-live="polite"></div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="login" id="login" hidden>
  <form id="loginForm">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3c3 5 8 8 8 15a8 8 0 0 1-16 0c0-4 2-6 4-8 0 3 1 5 3 6-1-5 0-9 1-13z" fill="currentColor"/></svg>
    <h1>Lucknow LPG RO</h1>
    <p>Pace board — every KPI against last year and AOP pro-rata.</p>
    <p class="note2" id="loginNote"></p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit">Open the board</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</div>
<script src="./static.js"></script>
<script src="./grammar.js"></script>
<script src="./app.js"></script>
</body>
</html>
