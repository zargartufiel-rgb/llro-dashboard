# LLRO watchdog — runs on GitHub, outside the Mac. If the LLRO Mac is off, asleep or stuck, it cannot send its own alerts;
# this check fails instead, and GitHub e-mails the repository owner about the failed run.
#   12:45 IST: today's daily dashboard upload must have happened.   17:45 IST: the dashboard must have been updated in the last 5 hours.
name: LLRO watchdog
on:
  schedule:
    - cron: '15 7 * * 1-6'    # 12:45 IST, Monday to Saturday
    - cron: '15 12 * * 1-6'   # 17:45 IST
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 200 }
      - name: Check that the dashboard is being updated
        run: |
          now=$(date +%s); last=$(git log -1 --format=%ct -- data); age=$(( (now - last) / 60 ))
          today=$(TZ=Asia/Kolkata date +%Y-%m-%d); hour=$(TZ=Asia/Kolkata date +%-H)
          echo "Last dashboard data: $(git log -1 --format='%ci  %s' -- data)  ($age minutes ago)"
          if [ "$hour" -lt 15 ]; then
            if ! git log --since="${today}T00:00:00+05:30" --format=%s -- data | grep -q "Daily data"; then
              echo "::error::No daily LLRO dashboard upload yet today. The LLRO Mac may be off, asleep or offline, or Chrome closed. Check the Mac."
              exit 1
            fi
          fi
          if [ "$age" -gt 300 ]; then
            echo "::error::The LLRO dashboard data was last updated $age minutes ago. The LLRO Mac may be off, asleep or offline."
            exit 1
          fi
          echo "OK"
